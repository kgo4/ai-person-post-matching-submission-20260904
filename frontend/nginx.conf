server {
    # Public-IP access remains available over HTTP for compatibility.
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;

    root         /usr/share/nginx/html;
    index        index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # The browser is same-origin with this reverse proxy. Do not forward
        # an IP-based Origin to the backend CORS filter.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    # Temporary HTTPS endpoint for camera/microphone demos accessed by IP.
    listen 443 ssl default_server;
    server_name 129.211.182.128 _;

    ssl_certificate /etc/nginx/certs/ip-server.crt;
    ssl_certificate_key /etc/nginx/certs/ip-server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 10m;
    add_header Permissions-Policy "camera=*,microphone=*" always;

    root         /usr/share/nginx/html;
    index        index.html;

    location = /index.html {
