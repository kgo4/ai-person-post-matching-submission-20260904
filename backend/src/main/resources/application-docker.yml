# ============================================
# Docker 环境配置
# 激活方式: SPRING_PROFILES_ACTIVE=docker
# 敏感信息（API Key 等）通过环境变量注入，不写入此文件
# ============================================

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:hrms_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD}
  flyway:
    enabled: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn
    com.example.matching: info
    org.springframework: warn
    org.mybatis: warn
    com.baomidou.mybatisplus: warn

resume:
  ocr:
    enabled: ${RESUME_OCR_ENABLED:false}
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}
    timeout-seconds: ${RESUME_OCR_TIMEOUT_SECONDS:180}
