name: Architecture CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-verify:
    name: Backend Verify (Test + ArchUnit + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Full Verification
        run: |
          cd backend
          mvn verify

  frontend-lint:
    name: Frontend Lint (TypeScript + ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Lint
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run lint

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Test
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run test:ci

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

  line-size-report:
    name: File Line Size Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report files over 400/500 lines
        run: |
          echo "## File Line Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files over 500 lines (should be split):" >> $GITHUB_STEP_SUMMARY
          find . -name '*.java' -o -name '*.vue' -o -name '*.ts' | while read f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "- \`$f\` ($lines lines)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### New/modified files over 400 lines (requires PR justification):" >> $GITHUB_STEP_SUMMARY
          git diff --name-only --diff-filter=A origin/${{ github.base_ref }}..HEAD 2>/dev/null | while read f; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              if [ "$lines" -gt 400 ]; then
                echo "- \`$f\` ($lines lines)" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files exceeding thresholds are listed above. Please review and justify in PR description." >> $GITHUB_STEP_SUMMARY

  quality-gates:
    name: Quality Gates
    needs: [backend-verify, frontend-lint, frontend-unit, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "Architecture gate status:"
          echo "  Backend Verify:  ${{ needs.backend-verify.result }}"
          echo "  Frontend Lint:   ${{ needs.frontend-lint.result }}"
          echo "  Frontend Unit:   ${{ needs.frontend-unit.result }}"
          echo "  Frontend Build:  ${{ needs.frontend-build.result }}"
          if [ "${{ needs.backend-verify.result }}" != "success" ]; then
            echo "::error::Backend verification failed. See test output."
            exit 1
          fi
          if [ "${{ needs.frontend-lint.result }}" != "success" ]; then
            echo "::error::Frontend lint failed."
            exit 1
          fi
          if [ "${{ needs.frontend-unit.result }}" != "success" ]; then
            echo "::error::Frontend unit tests failed."
            exit 1
          fi
          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "::error::Frontend build failed."
            exit 1
          fi
          echo "All quality gates passed."
