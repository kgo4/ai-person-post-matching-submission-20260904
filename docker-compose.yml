# ============================================
# AI 人岗匹配系统 — Docker Compose 编排
# 启动: docker compose up -d
# 停止: docker compose down
# ============================================

services:

  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: matching-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hrms_db}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - matching-net

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: matching-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - matching-net

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: matching-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - matching-net

  # ==================== Milvus (自建向量数据库) ====================
  # Milvus Standalone 依赖两个内部组件：
  #   - etcd：元数据存储（集合 schema、索引状态等）
  #   - MinIO：对象存储（向量数据、索引文件）
  # 三者共用 matching-net 网络，backend 通过 http://milvus:19530 访问。

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - matching-net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - matching-net

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: milvus-standalone
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      # Milvus 2.5 maps minio.accessKey/minio.secretKey to these names.
      MINIO_ACCESSKEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRETKEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      - matching-net

  # ==================== Neo4j（服务器本地图谱库） ====================
  neo4j:
    image: neo4j:5-community
    container_name: matching-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?NEO4J_AUTH is required}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512m}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - matching-net

  # ==================== 后端 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: matching-backend:latest
    container_name: matching-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hrms_db}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_MODEL_DEPLOYMENT_KEY: ${AI_MODEL_DEPLOYMENT_KEY:?AI_MODEL_DEPLOYMENT_KEY is required}
      PMS_DB_URL: ${PMS_DB_URL:-}
      PMS_DB_USERNAME: ${PMS_DB_USERNAME:-}
      PMS_DB_PASSWORD: ${PMS_DB_PASSWORD:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?SILICONFLOW_API_KEY is required}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      MILVUS_ENABLED: "true"
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ""
      MILVUS_DATABASE: default
      NEO4J_ENABLED: ${NEO4J_ENABLED:-true}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      VOLCENGINE_ARK_BASE_URL: ${VOLCENGINE_ARK_BASE_URL:-https://ark.cn-beijing.volces.com}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:?VOLCENGINE_ARK_API_KEY is required}
      VOLCENGINE_ARK_MODEL: ${VOLCENGINE_ARK_MODEL:-doubao-seed-2-1-pro-260628}
      VOLCENGINE_ARK_VISION_MODEL: ${VOLCENGINE_ARK_VISION_MODEL:-doubao-seed-2-1-turbo-260628}
      VOLCENGINE_ASR_WS_URL: ${VOLCENGINE_ASR_WS_URL:-wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async}
      VOLCENGINE_ASR_APP_ID: ${VOLCENGINE_ASR_APP_ID:-}
      VOLCENGINE_ASR_ACCESS_KEY: ${VOLCENGINE_ASR_ACCESS_KEY:-}
      VOLCENGINE_ASR_API_KEY: ${VOLCENGINE_ASR_API_KEY:?VOLCENGINE_ASR_API_KEY is required}
      VOLCENGINE_ASR_RESOURCE_ID: ${VOLCENGINE_ASR_RESOURCE_ID:-volc.seedasr.sauc.duration}
      ZHIHU_ENABLED: ${ZHIHU_ENABLED:-false}
      ZHIHU_API_BASE_URL: ${ZHIHU_API_BASE_URL:-https://developer.zhihu.com}
      ZHIHU_ACCESS_SECRET: ${ZHIHU_ACCESS_SECRET:-}
      ZHIHU_CONNECT_TIMEOUT_MILLIS: ${ZHIHU_CONNECT_TIMEOUT_MILLIS:-5000}
      ZHIHU_READ_TIMEOUT_MILLIS: ${ZHIHU_READ_TIMEOUT_MILLIS:-15000}
      LANGCHAIN4J_AGENTS_ENABLED: ${LANGCHAIN4J_AGENTS_ENABLED:-true}
      LANGCHAIN4J_BASE_URL: ${LANGCHAIN4J_BASE_URL:?LANGCHAIN4J_BASE_URL is required}
      LANGCHAIN4J_API_KEY: ${LANGCHAIN4J_API_KEY:?LANGCHAIN4J_API_KEY is required}
      LANGCHAIN4J_MODEL_NAME: ${LANGCHAIN4J_MODEL_NAME:?LANGCHAIN4J_MODEL_NAME is required}
      LANGCHAIN4J_TEMPERATURE: ${LANGCHAIN4J_TEMPERATURE:-0.1}
      LANGCHAIN4J_TIMEOUT_SECONDS: ${LANGCHAIN4J_TIMEOUT_SECONDS:-300}
      AI_THINKING_DISABLED: ${AI_THINKING_DISABLED:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      RESUME_OCR_ENABLED: ${RESUME_OCR_ENABLED:-true}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      RESUME_OCR_TIMEOUT_SECONDS: ${RESUME_OCR_TIMEOUT_SECONDS:-180}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s
    networks:
      - matching-net

  # ==================== 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: matching-frontend:latest
    container_name: matching-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - matching-net

# ==================== 数据卷 ====================
volumes:
  mysql_data:
    name: matching-mysql-data
  redis_data:
    name: matching-redis-data
  etcd_data:
    name: matching-etcd-data
  minio_data:
    name: matching-minio-data
  milvus_data:
    name: matching-milvus-data
  neo4j_data:
    name: matching-neo4j-data
  neo4j_logs:
    name: matching-neo4j-logs
  uploads_data:
    name: matching-uploads-data

# ==================== 网络 ====================
networks:
  matching-net:
    name: matching-net
    driver: bridge
